[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# A placeholder: the release tag is the only record of the version, and the
# release workflow stamps it here (scripts/stamp-version.pl) before it
# publishes.
version = "0.0.0"
authors = ["Alisue <lambdalisue@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/arto-app/arto-markdown"
homepage = "https://github.com/arto-app/arto-markdown"
# The repository README, resolved from the workspace root and copied into the
# package, so the registry page says what the renderer is and how a host uses
# it.
readme = "README.md"

# Versions for the dependencies the members name with `<name>.workspace =
# true`, kept in one place so a second member cannot drift from the first.
[workspace.dependencies]
base64 = "0.23.1"
html-escape = "0.3.0"
indoc = "2.0.7"
insta = { version = "1.48.0", features = ["glob"] }
lol_html = "3.0.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
