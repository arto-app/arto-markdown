# Link checker settings for `just docs` and the docs job in CI.
#
# Offline on purpose: the point is to catch a relative link or anchor that
# rotted when a file moved, not to depend on third-party sites being up.
offline = true
no_progress = true
include_fragments = "anchor-only"
exclude_path = [
  "target",
  "node_modules",
  "packages/markdown/node_modules",
  "packages/markdown/dist",
  ".git",
  # The samples link to missing files on purpose: that is what they test.
  "samples",
]
# Placeholders that are not links. Local links are file:// URLs to lychee,
# and they are the ones this check is for, so they are not excluded.
exclude = ["^mailto:"]
