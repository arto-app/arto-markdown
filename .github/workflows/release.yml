name: "Release"

# Publishing a GitHub release (tag `vX.Y.Z`, notes written by hand) publishes
# the renderer at that version: `arto-markdown` to crates.io and
# `@arto-app/markdown` to npm. Git holds `0.0.0` in both manifests; the tag
# is stamped over it here, by the script `just stamp-check` runs on every
# pull request.
#
# No registry token lives in this repository. Both registries trust this
# file, in the environment "release", as a trusted publisher, and exchange
# GitHub's OIDC claim for a token that expires with the job — which is why
# `id-token: write` is granted to these jobs alone.
#
# One job per registry: a version can only be published once, so a job that
# failed is re-run on its own without trying the other registry again.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache a pull request could have written reaches a release.
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Stamp the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: perl scripts/stamp-version.pl "${TAG#v}"
      # The crate's `include` list names the bundles, which git does not
      # track: they are build output.
      - run: just assets
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Verified as `just package` verifies it on every pull request; this
      # run matters for the stamped version. `--allow-dirty` because the
      # stamp deliberately leaves the tree modified.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p arto-markdown --locked --allow-dirty

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The WebAssembly build the package carries.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache a pull request could have written reaches a release.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen at the version crates/arto-markdown-wasm pins, for
          # `just wasm-package`; the devShell has the same one.
          tool: just,wasm-bindgen@0.2.130
      - name: Stamp the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: perl scripts/stamp-version.pl "${TAG#v}"
      # Builds the bundles, the theme stylesheet and the WebAssembly the
      # package carries, and fails before publishing if the package would
      # leave a file out.
      - run: just npm-package
      # npm exchanges the OIDC claim itself (trusted publishing) and records
      # the provenance of the build.
      - name: Publish to npm
        working-directory: packages/markdown
        run: npm publish --provenance --access public
